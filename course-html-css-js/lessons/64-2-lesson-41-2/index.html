<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    const theme = document.querySelector("html").setAttribute("data-theme", localStorage.getItem("theme") || "light");
  </script>

  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
  <!-- <script src="../../../scripts/smooth-scroll.js" defer></script> -->

  <script type="module" src="../../../scripts/theme-toggle.js" defer></script>
  <script type="module" src="../../../scripts/log-to-page.js" defer></script>
  <script type="module" src="../../../scripts/shiki-loader.js" defer></script>

  <script src="../../../scripts/nav.js" defer></script>
  <script src="../../../scripts/timer.js" defer></script>

  <script type="module" src="./scripts/script.js" defer></script>

  <title>ICH WD</title>
  <link rel="icon" href="../../../favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link href="../../../styles/styles.css" rel="stylesheet">
  <link href="./styles/styles.css" rel="stylesheet">
</head>

<body class="text-base">
  <div class="base-layout">

    <!-- <div class="sidebar"></div> -->

    <header>
      <div class="container flex items-center justify-between px-8">
        <h4 class="uppercase">
          <a class="flex" href="/index.html">
            <span class="text-secondary font-black">ICH</span>
            <span class="font-black text-muted">.</span>
            <span class="text-accent">WD</span>
          </a>
        </h4>
        <div class="flex items-center justify-end gap-1">
          <nav class="flex items-center gap-1">
            <!-- В этом ul рендерится навигация сайта через nav.js-->
            <ul></ul>
          </nav>
          <button id="theme-toggle" class="btn btn-ghost"></button>
        </div>
      </div>
    </header>

    <main>
      <section class="h-full">
        <div class="container flex flex-col h-full px-8">

          <!-- ===== Lesson ===== -->
          <div class="content flex flex-col flex-1 m-auto">
            <h2 class="title">64.2 Lesson 41.2</h2>
            <div id="app-notification" class="flex-1 flex flex-col items-center gap-8">
              <form id="order-form" class="flex flex-col items-center m-auto">
                <input id="address" name="address" type="text" placeholder="Address" required />
                <input id="price" name="price" type="text" placeholder="Price" required />
                <input id="receiver" name="receiver" type="text" placeholder="Receiver" required />
                <input class="btn btn-accent px-6 btn-round" type="submit" value="Submit" />
              </form>

              <div id="order-buttons" class="flex flex-col items-center gap-4">
                <button id="order-paid" class="btn btn-round px-6">Заказ оплачен</button>
                <button id="order-sent" class="btn btn-round px-6">Заказ отправлен</button>
                <button id="order-received" class="btn btn-round px-6">Заказ получен</button>
              </div>
            </div>
          </div>
          <!-- ===== Lesson END ===== -->
        </div>
      </section>
    </main>
  </div>

  <!-- В этом div выводятся блоки кода из любых файлов загруженных через fetch-as-text.js -->
  <div class="container px-8">
    <div id="code-block" class="content flex flex-col gap-4 text-sm mb-8 m-auto"></div>
  </div>

  <footer class="text-sm">
    <div id="footer-content" class="container px-8">
      <div class="flex flex-col justify-between text-left gap-1">
        <span class="font-semibold text-accent">It Career Hub Web Developer</span>
        <span>Designed & built by&nbsp;<a class="link nowrap" href="https://artemkutsan.pp.ua">Artem Kutsan</a></span>
        <span>&copy; Copyright 2025</span>
      </div>
      <div class="flex flex-col justify-between text-right">
        <span id="current-time" class="text-5xl font-bold text-accent"></span>
        <span id="current-zone"></span>
      </div>
    </div>
  </footer>

</body>

</html>
